[workspace.package]
version = "0.2.0"
edition = "2024"


[workspace]
resolver = "3"
members = [
    "bevy_dioxus_sync",
    "crates/*",
    "examples/*"
]

[workspace.dependencies]
dioxus-native = { version = "=0.8.0-alpha.3", default-features = false, features = ["net", "html", "vello", "system-fonts"] }
dioxus = { version = "=0.8.0-alpha.3", default-features = false }
dioxus-signals = { version = "=0.8.0-alpha.3" }
dioxus-hooks = { version = "=0.8.0-alpha.3" }
dioxus-core = { version = "=0.8.0-alpha.3" }
dioxus-html = { version = "=0.8.0-alpha.3" }
dioxus-core-macro = { version = "=0.8.0-alpha.3" }
dioxus-devtools = { version = "=0.8.0-alpha.3" }
dioxus-document = { version = "=0.8.0-alpha.3" }
dioxus-asset-resolver = { version = "=0.8.0-alpha.3" }
dioxus-history = { version = "=0.8.0-alpha.3" }
generational-box = { version = "=0.8.0-alpha.3" }

bevy_dioxus_render = {path = "./crates/render", version = "0.2"}
bevy_dioxus_interop = {path = "./crates/interop", version = "0.2"}
bevy_dioxus_messages = {path = "./crates/messages", version = "0.2"}
bevy_dioxus_tracing = {path = "./crates/tracing", version = "0.2"}
bevy_dioxus_sync = {path = "./bevy_dioxus_sync", version = "0.2"}

bevy = {version = "0.20", default-features = false}
bevy_ecs = {version = "0.20"}
bevy_render = {version = "0.20"}
bevy_app = {version = "0.20"}
bevy_transform = {version = "0.20"}
bevy_mesh = {version = "0.20"}
bevy_utils = {version = "0.20"}
bevy_window = {version = "0.20"}
bevy_math = {version = "0.20"}
bevy_winit = {version = "0.20"}
bevy_asset = {version = "0.20"}
bevy_input = {version = "0.20"}
bevy_time = {version = "0.20"}
bevy_image = {version = "0.20"}
bevy_picking = {version = "0.20"}
bevy_derive = {version = "0.20"}
bevy_color = {version = "0.20"}
bevy_shape = {version = "0.20"}
bevy_sprite = {version = "0.20"}
bevy_pbr = {version = "0.20"}
bevy_core_pipeline = {version = "0.20"}
bevy_material = {version = "0.20"}
bevy_tasks = {version = "0.20"}
bevy_camera = {version = "0.20"}
bevy_sprite_render = {version = "0.20"}

rustc-hash = "1"
bytemuck = "1.25"
data-url = "0.3.2"
bytes = "1.10"
tokio = "1.51"
maybe-debug = "0.1"
arc-swap = "1.7"
macro-v = "0.1.4"
tracing = {version = "0.1.44"}
tracing-chrome = "0.7"
tracing-subscriber = "0.3"

anyrender_vello = {version = "0.15", default-features = false}
blitz-net = { version = "=0.3.0-beta.4", default-features = false}
blitz-paint = { version = "=0.3.0-beta.4", default-features = false}
blitz-traits = { version = "=0.3.0-beta.4", default-features = false}
blitz-dom = { version = "=0.3.0-beta.4", default-features = false}
# blitz-shell = { version = "=0.3.0-beta.4", default-features = false }
blitz-html = {version = "=0.3.0-beta.4", default-features = false}
vello = {version = "0.11"}
linebender_resource_handle = "0.1"
parley = {version = "0.12", features = ["std"]}
keyboard-types = "0.8.3"
bitflags = "2"

async-std = "1.13"
crossbeam-channel = "0.5"
wgpu = "30"
wgpu-types = "30"
dioxus_bevy_signals = {path = "../queued_signal/crates/dioxus_bevy_signals"}
