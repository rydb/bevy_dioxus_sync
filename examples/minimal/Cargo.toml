[package]
name = "minimal"
version.workspace = true
edition.workspace = true

[dependencies]
# Engine features are listed explicitly because the workspace disables default features.
bevy = { workspace = true, features = [
    "std", "multi_threaded", "png", "zstd_rust", "tonemapping_luts",
    "x11", "wayland", "trace_tracy",
    "bevy_render", "bevy_winit", "bevy_window", "bevy_log", "bevy_asset",
    "bevy_image", "bevy_mesh", "bevy_shader", "bevy_material", "bevy_camera",
    "bevy_light", "bevy_pbr", "bevy_core_pipeline", "bevy_post_process",
    "bevy_sprite", "bevy_sprite_render", "bevy_gizmos", "bevy_gizmos_render",
    "bevy_text", "bevy_picking", "hdr"
] }
bevy_ecs = {workspace = true}
bevy_app = {workspace = true}
bevy_color = {workspace = true}
bevy_asset = {workspace = true}
bevy_pbr = {workspace = true}
bevy_transform = {workspace = true}
bevy_derive = {workspace = true}
bevy_dioxus_sync = {workspace = true}
bevy_dioxus_interop = {workspace = true}
bevy_dioxus_render = {workspace = true}
bevy_dioxus_tracing = {workspace = true}
bevy_picking = { workspace = true, features = ["mesh_picking"] }
blitz-dom = {workspace = true}
dioxus-core = {workspace = true}
dioxus-native = {workspace = true}
dioxus_bevy_signals = {workspace = true}
bevy_dioxus_messages = {workspace = true}
dioxus = {workspace = true, features = ["html", "signals", "hooks", "macro", "asset", "document", "launch", "devtools"]}
tracing-subscriber = {workspace = true}
tracing-chrome = {workspace = true}
